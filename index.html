<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    // Register Service Worker only for HTTP/HTTPS and NOT on localhost in dev
    const isLocalhost = window.location.hostname === 'localhost' ||
      window.location.hostname === '127.0.0.1' ||
      window.location.hostname === '';

    if ('serviceWorker' in navigator) {
      if (isLocalhost) {
        // Aggressively unregister any existing SW on localhost to fix "Failed to fetch" errors in dev
        navigator.serviceWorker.getRegistrations().then(registrations => {
          for (let registration of registrations) {
            registration.unregister();
            console.log('Unregistered SW on localhost for development stability');
          }
        });
      } else if (window.location.protocol !== 'file:') {
        // Only register in non-local environments
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('SW registered:', reg.scope))
            .catch(err => console.log('SW registration failed:', err));
        });
      }
    }
  </script>
</body>
